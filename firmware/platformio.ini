; =============================================================================
; PulseBox Cyber Desk — ESP32 PlatformIO Configuration (DRAFT)
; =============================================================================
;
; NOTE: This is a proposed DRAFT configuration. Do NOT attempt to build or flash
; until the physical ESP32 board model, pin count, and display pinout are confirmed
; using firmware/HARDWARE_CHECKLIST.md.
;
; Documentation: https://docs.platformio.org/page/projectconf.html
; =============================================================================

[platformio]
default_envs = esp32_draft
src_dir = src
include_dir = include

; -----------------------------------------------------------------------------
; Common environment settings across all build variants
; -----------------------------------------------------------------------------
[env]
platform = espressif32 @ ^6.5.0
framework = arduino

; Serial Monitor Baud Rate (matches PulseBox UART0 rate: 115200 baud, 8-N-1)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; Upload speed (lower to 115200 or 460800 if uploading fails on long USB cables)
upload_speed = 921600

; -----------------------------------------------------------------------------
; Default Draft Environment: Standard ESP32-WROOM Development Board
; -----------------------------------------------------------------------------
[env:esp32_draft]
; Proposed default for standard 30-pin or 38-pin ESP-WROOM-32 / NodeMCU-32S boards.
; If your board has an ESP32-S3 chip, this will be changed to `esp32-s3-devkitc-1`.
board = esp32dev
upload_port = COM3
monitor_port = COM3

; Candidate libraries proposed for the PulseBox firmware:
; - bblanchon/ArduinoJson: High-performance, memory-bounded JSON parser for Flask API payloads
; - bodmer/TFT_eSPI: Fast DMA-enabled ILI9341 SPI graphics library (or Adafruit-GFX alternate)
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TFT_eSPI @ ^2.5.43

; Build flags: Configured for 2.8" ILI9341 SPI TFT (320x240)
build_flags =
    -D CORE_DEBUG_LEVEL=3          ; Info-level ESP-IDF logging
    -D USER_SETUP_LOADED=1         ; Use PlatformIO build flags for TFT_eSPI
    -D ILI9341_2_DRIVER=1          ; Alternative ILI9341 initialization sequence
    -D TFT_RGB_ORDER=1             ; Explicitly select RGB color order
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_CS=5                    ; Hardware VSPI Chip Select
    -D TFT_DC=27                   ; Data/Command (Safe GPIO, avoids GPIO 2 strap)
    -D TFT_RST=4                   ; Hardware Reset (Safe GPIO)
    -D TFT_MOSI=23                 ; Hardware VSPI MOSI
    -D TFT_SCLK=18                 ; Hardware VSPI SCK
    -D TFT_MISO=19                 ; Hardware VSPI MISO
    -D TOUCH_CS=21                 ; Dedicated Touch Chip Select
    -D SPI_TOUCH_FREQUENCY=2500000 ; 2.5 MHz SPI clock for HR2046
    -D LOAD_GLCD=1                 ; Standard system font
    -D LOAD_FONT2=1                ; Small font
    -D LOAD_FONT4=1                ; Medium cyberpunk font
    -D LOAD_FONT6=1                ; Large font
    -D LOAD_FONT7=1                ; 7-segment font
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000      ; 27 MHz SPI (Safe & fast on breadboard)
    -D SPI_READ_FREQUENCY=20000000

; -----------------------------------------------------------------------------
; Alternative: ESP32-S3 DevKit (keep for reference if board is confirmed as S3)
; -----------------------------------------------------------------------------
[env:esp32s3_variant]
board = esp32-s3-devkitc-1
platform = espressif32 @ ^6.5.0
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
