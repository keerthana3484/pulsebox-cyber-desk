<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, height=240, initial-scale=1.0">
  <title>PulseBox Screen Capture Fixture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/simulatorStyle.css">
  <link rel="stylesheet" href="/src/voxelComponents.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 320px;
      height: 240px;
      overflow: hidden;
      background: #05070D;
      color: #E2E8F0;
      font-family: 'Silkscreen', 'Press Start 2P', monospace;
      image-rendering: pixelated;
    }
    #lcd-container {
      width: 320px;
      height: 240px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .status-bar-capture {
      height: 16px;
      background: #0B111E;
      border-bottom: 1px solid #162035;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      font-size: 8px;
      color: #94A3B8;
      flex-shrink: 0;
    }
    .viewport-capture {
      height: 192px;
      width: 320px;
      overflow: hidden;
      position: relative;
      background: #07090E;
      flex-shrink: 0;
    }
    .hotbar-capture {
      height: 32px;
      width: 320px;
      background: #000;
      border-top: 1px solid #162035;
      display: flex;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="lcd-container">
    <div class="status-bar-capture">
      <span style="color: #00E676;">[SIM] 📶 5G</span>
      <span id="cap-title" style="font-weight: 700; color: #00E5FF;">SYSTEM STATUS</span>
      <span>12:00</span>
    </div>
    <div class="viewport-capture" id="cap-viewport"></div>
    <div class="hotbar-capture" id="cap-hotbar"></div>
  </div>

  <script type="module">
    import { renderHomeScreen } from "./src/screens/home.js";
    import { renderServersScreen } from "./src/screens/servers.js";
    import { renderIncidentsScreen } from "./src/screens/incidents.js";
    import { renderCloudCostsScreen } from "./src/screens/cloudCosts.js";
    import { renderDeployScreen } from "./src/screens/deploy.js";
    import { renderCompanionScreen } from "./src/screens/companion.js";
    import { renderFocusTimerScreen } from "./src/screens/focusTimer.js";
    import { renderSettingsScreen } from "./src/screens/settings.js";
    import { buildHotbarNavigation } from "./src/voxelComponents.js";
    import { createMockState } from "./src/mockData.js";

    const params = new URLSearchParams(window.location.search);
    const screen = params.get("screen") || "servers";
    const view = params.get("view") || "overview";
    const theme = params.get("theme") || "night";

    if (theme === "day") {
      document.body.classList.add("day-mode");
      document.getElementById("lcd-container")?.classList.add("day-mode");
    }

    const viewport = document.getElementById("cap-viewport");
    const titleEl = document.getElementById("cap-title");
    const hotbarMount = document.getElementById("cap-hotbar");

    const state = createMockState();
    state.backendConnected = true;

    const mockActions = {
      api: {
        getHealth: async () => ({ status: "healthy" }),
        getState: async () => state,
        getCosts: async () => ({
          today_spend: 64.20,
          month_spend: 1842.60,
          monthly_budget: 2500.00,
          budget_used_pct: 73.7,
          remaining_budget: 657.40,
          budget_status: "NORMAL",
          daily_trend: Array.from({ length: 15 }, (_, i) => ({ day: i + 1, amount: 40 + (i * 3) })),
          breakdown: [
            { name: "Compute (K8s/EC2)", amount: 1100, percentage: 60, color: "#2979FF" },
            { name: "Managed DB (RDS)", amount: 450, percentage: 24, color: "#00E676" },
            { name: "Storage & Backups", amount: 190, percentage: 10, color: "#FFB300" },
            { name: "Ingress & Edge", amount: 102.6, percentage: 6, color: "#7C4DFF" },
          ],
          days_remaining: 15,
          timestamp: new Date().toISOString(),
        }),
        getIncidents: async () => [
          {
            id: "INC-001",
            server_id: "srv-api",
            server_name: "API Gateway",
            severity: "CRITICAL",
            status: "OPEN",
            consecutive_failure_count: 3,
            created_at: new Date(Date.now() - 120000).toISOString(),
            message: "Node reached 3 consecutive failed health checks",
          }
        ],
        restoreServer: async () => ({ status: "success" }),
        simulateFailure: async () => ({ status: "success" }),
      },
      onStateChange: () => () => {},
      playClick: () => {},
      playBeep: () => {},
      playSuccess: () => {},
      playAlert: () => {},
      logSerial: () => {},
      refreshBackendState: async () => {},
    };

    const skyMode = params.get("sky");
    const options = { initialShowDetail: view === "detail", forceSkyMode: skyMode };
    let hotbarIndex = 0;

    if (screen === "home") {
      titleEl.textContent = "SYSTEM STATUS";
      hotbarIndex = 0;
      renderHomeScreen(viewport, state, mockActions, options);
    } else if (screen === "servers") {
      titleEl.textContent = "CLUSTER NODES";
      hotbarIndex = 1;
      renderServersScreen(viewport, state, mockActions, options);
    } else if (screen === "incidents") {
      titleEl.textContent = "INCIDENT LOG";
      hotbarIndex = 2;
      renderIncidentsScreen(viewport, state, mockActions, options);
    } else if (screen === "costs") {
      titleEl.textContent = "CLOUD COSTS";
      hotbarIndex = 3;
      renderCloudCostsScreen(viewport, state, mockActions, options);
    } else if (screen === "deploy") {
      titleEl.textContent = "RELEASE PIPELINE";
      hotbarIndex = 4;
      renderDeployScreen(viewport, state, mockActions, options);
    } else if (screen === "companion") {
      titleEl.textContent = "WEATHER + CLOCK";
      hotbarIndex = 5;
      renderCompanionScreen(viewport, state, mockActions, options);
    } else if (screen === "focusTimer") {
      titleEl.textContent = "FOCUS TIMER";
      hotbarIndex = 6;
      renderFocusTimerScreen(viewport, state, mockActions, options);
    } else if (screen === "settings") {
      titleEl.textContent = "DEVICE CONFIG";
      hotbarIndex = 7;
      renderSettingsScreen(viewport, state, mockActions, options);
    }

    hotbarMount.innerHTML = buildHotbarNavigation({ activeIndex: hotbarIndex });
  </script>
</body>
</html>
