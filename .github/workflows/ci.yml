name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-scans:
    name: Security Scans (Gitleaks, pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pip-audit for Python dependency vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run npm audit for frontend dependency vulnerabilities
        run: npm audit --prefix frontend --audit-level=high

  test-and-build:
    name: Run Test Suites & Production Build
    needs: security-scans
    runs-on: ubuntu-latest
    env:
      PULSEBOX_API_KEY: "test_pulsebox_secret_key_123"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        run: python -m pytest -v tests/test_backend.py

      - name: Start Flask backend for integration tests
        run: |
          PYTHONPATH=backend python backend/app.py &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/health > /dev/null; then
              echo "Flask backend is up and running!"
              break
            fi
            echo "Waiting for Flask backend..."
            sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend incident test suite
        run: node tests/test_frontend_incidents.js

      - name: Run frontend cloud costs test suite
        run: node tests/test_frontend_costs.js

      - name: Run frontend weather & clock test suite
        run: node tests/test_frontend_weather_clock.js

      - name: Run frontend focus timer test suite
        run: node tests/test_frontend_focus_timer.js

      - name: Run embedded screen simulator test suite
        run: node tests/test_embedded_simulator.js

      - name: Run frontend production build
        run: npm run build --prefix frontend
