name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Run Test Suites & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend pytest suite
        run: python -m pytest -v tests/test_backend.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend incident test suite
        run: node tests/test_frontend_incidents.js

      - name: Run frontend cloud costs test suite
        run: node tests/test_frontend_costs.js

      - name: Run frontend weather & clock test suite
        run: node tests/test_frontend_weather_clock.js

      - name: Run frontend focus timer test suite
        run: node tests/test_frontend_focus_timer.js

      - name: Run frontend production build
        run: npm run build --prefix frontend
